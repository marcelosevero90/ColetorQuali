name: Build Android APK (Coletor Quali Datasul)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Coletor Quali
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📦 Instalar Dependências NPM
        run: npm install

      - name: 🔄 Copiar Assets e Sincronizar Capacitor Android
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew
          npx cap sync android

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: 📱 Instalar Android SDK Platform e Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: 📱 Compilar APK com Gradle
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: 🏷️ Renomear APK para Distribuição
        run: |
          APK_PATH=$(find android -type f -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERRO: Nenhum APK encontrado gerado pelo Gradle!"
            find android -maxdepth 5 || true
            exit 1
          fi
          echo "✅ APK localizado em: $APK_PATH"
          cp "$APK_PATH" ./Coletor-Quali-Datasul.apk
          ls -lh ./Coletor-Quali-Datasul.apk

      - name: 📤 Salvar APK como Artefato da Execução (Download no GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Coletor-Quali-Datasul-APK
          path: Coletor-Quali-Datasul.apk
          retention-days: 30

      - name: 🚀 Criar ou Atualizar Release no GitHub com Download Direto do APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        continue-on-error: true
        with:
          tag_name: v3.1.0-android
          name: "Coletor Quali Datasul v3.1.0 - APK Android"
          body: |
            ### 📦 Coletor Quali Datasul - Aplicativo Móvel Nativo (Android)
            
            Aplicativo de Inventário Físico, Transferência de Materiais, Requisições e Reporte de Ordem de Produção (CP0311) integrado ao TOTVS Datasul com suporte Offline-First.
            
            - **Arquivo:** `Coletor-Quali-Datasul.apk`
            - **Versão:** v3.1.0
            - **Compatibilidade:** Android 7.0+ (Nougat até Android 15 / API 36)
            - **Recursos:** Leitor de código de barras por câmera, banco local IndexedDB para operação 100% offline e ponte inteligente com o servidor Gateway.
          files: Coletor-Quali-Datasul.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
